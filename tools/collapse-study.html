<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>岩坡崩塌 · 独立动作小样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131a20;color:#e5e6e1;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#view{position:fixed;inset:0 0 150px}header{position:absolute;top:24px;left:28px;pointer-events:none}small{color:#9bb1bc;letter-spacing:.15em}h1{font-size:24px;font-weight:450;margin:8px 0}header p{color:#b6bfc2;margin:6px 0;font-size:12px}footer{position:fixed;bottom:0;width:100%;min-height:150px;background:#10181deb;border-top:1px solid #35434b;padding:16px 28px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.timeline{display:flex;gap:16px;align-items:center;margin-bottom:12px}input[type=range]{flex:1;accent-color:#b8cec5;min-width:100px}button,select{background:#26343d;color:#f1f3ed;border:1px solid #4d606b;border-radius:4px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a5e9f7;outline-offset:3px}label{font-size:12px;color:#c5cdd0;white-space:nowrap}input[type=checkbox]{accent-color:#a4cabc}output{font:12px ui-monospace,monospace;color:#9eb0b9}#detail{font:11px system-ui;color:#859ba8;margin:10px 0 0}#phase{position:absolute;bottom:22px;left:28px;color:#f5ebda;font-size:18px}#error{color:#ffbca5} @media(max-width:700px){#view{bottom:225px}footer{min-height:225px;padding:12px 16px}.row{gap:9px}header{left:16px;top:16px}h1{font-size:20px}header p{max-width:290px}.row button{padding:7px 9px}}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script></head>
<body><main id="view" aria-label="可旋转观察的三维岩坡"><header><small>独立动作测试 / 不影响正式游戏</small><h1>断裂、失稳、坠落</h1><p>拖动观察 · 滚轮缩放 · 烟尘默认开启，震动关闭</p><p id="loading">正在载入烘焙岩层动画……</p><p id="error" role="alert"></p></header><div id="phase" aria-live="polite">完整岩坡</div></main>
<footer><div class="timeline"><button id="play" disabled>播放崩塌</button><input id="time" aria-label="动画时间" type="range" min="0" max="14" step=".02" value="0"><output id="clock">0.00 / 14.00 秒</output></div>
<div class="row"><button id="reset" disabled>重置</button><button id="front">正面观察</button><button id="side">斜侧观察</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">半速检查</option><option value=".25">四分之一速度</option></select><label><input id="dust" type="checkbox" checked>烟尘</label><select id="dustStrength" aria-label="烟尘浓度"><option value="1">标准烟尘</option><option value="1.45">浓烟尘</option><option value=".5">稀薄烟尘</option></select><button id="smokePreview">烟尘定格</button><label><input id="shake" type="checkbox">短促震动</label><label><input id="clay" type="checkbox">无贴图检查</label></div>
<p id="detail">固定拓扑岩块 · 离线碰撞烘焙 · 不运行全地图破坏模拟</p><output id="diagnostics"></output> <button id="impact" style="padding:3px 8px;font-size:11px">碰撞定格</button> <button id="end" style="padding:3px 8px;font-size:11px">结束定格</button> <label><input id="originalRock" type="checkbox">原版岩石对比</label> <a id="versionLink" href="?collapse-version=1" style="font-size:11px;color:#b8cec5;margin-left:12px">查看旧版动作</a></footer>
<script type="module" src="./collapse-study.js"></script></body></html>
